name: Test On Push/PR

on:
    push:
        branches:
        - main
    pull_request:
      branches: 
      - main

jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Setup Go
          uses: actions/setup-go@v6
          with:
            go-version: '1.26'
        - uses: actions/checkout@v3
        - name: Get Dagger
          run: cd ci && go get dagger.io/dagger@latest && cd ..
        - name: Run Dagger Test Workflow
          run: go run ci/test_on_push.go
